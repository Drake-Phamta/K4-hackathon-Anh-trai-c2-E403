<meta charset="utf-8">
<title>VLearn Slide Tutor — Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ══════════════════════════════════════════════════════════════════════
   CONSOLE — bảng điều khiển. Dày đặc, ưu tiên dữ liệu, phơi bày cơ chế.
   Palette: slate lệch xanh (không phải grey trung tính vô cảm)
   Type: system sans cho chữ, mono cho số/mã — mono là ngôn ngữ của bảng đo
   ══════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light dark;
  --bg:#eef1f6; --panel:#ffffff; --sunk:#f4f6fa; --line:#dde3ec;
  --fg:#141922; --dim:#5b6577; --faint:#8b95a7;
  --accent:#2563d8; --accent-soft:#e5edfd;
  --ok:#0f7a52; --ok-soft:#e2f4ec;
  --warn:#8a5a06; --warn-soft:#fdf0d8;
  --bad:#b3312f; --bad-soft:#fdeae9;
  --pv-paper:#fff; --pv-shadow:0 1px 3px rgba(20,25,34,.14),0 6px 22px rgba(20,25,34,.09);
  --pv-num:#8b95a7; --pv-numbg:rgba(255,255,255,.9);
  --pv-sel:rgba(37,99,216,.26); --pv-hit:rgba(217,152,32,.42); --pv-hit-strong:rgba(217,152,32,.8);
  --pv-radius:3px;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1017; --panel:#151a23; --sunk:#10141c; --line:#242c3a;
    --fg:#e3e8f0; --dim:#98a3b6; --faint:#69748a;
    --accent:#5b95ff; --accent-soft:#182742;
    --ok:#48c48c; --ok-soft:#0f2b20;
    --warn:#e0a83a; --warn-soft:#33270e;
    --bad:#f0736f; --bad-soft:#341a1b;
    --pv-paper:#fff; --pv-shadow:0 2px 18px rgba(0,0,0,.55);
    --pv-numbg:rgba(255,255,255,.85);
    --pv-sel:rgba(91,149,255,.4);
  }
}
:root[data-theme="light"]{
  --bg:#eef1f6; --panel:#fff; --sunk:#f4f6fa; --line:#dde3ec;
  --fg:#141922; --dim:#5b6577; --faint:#8b95a7;
  --accent:#2563d8; --accent-soft:#e5edfd;
  --ok:#0f7a52; --ok-soft:#e2f4ec; --warn:#8a5a06; --warn-soft:#fdf0d8;
  --bad:#b3312f; --bad-soft:#fdeae9;
  --pv-shadow:0 1px 3px rgba(20,25,34,.14),0 6px 22px rgba(20,25,34,.09);
  --pv-numbg:rgba(255,255,255,.9); --pv-sel:rgba(37,99,216,.26);
}
:root[data-theme="dark"]{
  --bg:#0d1017; --panel:#151a23; --sunk:#10141c; --line:#242c3a;
  --fg:#e3e8f0; --dim:#98a3b6; --faint:#69748a;
  --accent:#5b95ff; --accent-soft:#182742;
  --ok:#48c48c; --ok-soft:#0f2b20; --warn:#e0a83a; --warn-soft:#33270e;
  --bad:#f0736f; --bad-soft:#341a1b;
  --pv-shadow:0 2px 18px rgba(0,0,0,.55);
  --pv-numbg:rgba(255,255,255,.85); --pv-sel:rgba(91,149,255,.4);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--fg);
  font-size:14px;line-height:1.55;overflow:hidden}
button,input,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:var(--mono);font-size:.92em;background:var(--sunk);
  padding:1px 5px;border-radius:4px}

#app{display:flex;flex-direction:column;height:100vh}
#bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-weight:640;letter-spacing:-.012em;white-space:nowrap;display:flex;
  align-items:baseline;gap:7px}
.brand em{font-style:normal;font-size:11px;font-weight:500;color:var(--faint);
  font-family:var(--mono)}
.sp{flex:1}
.btn{background:var(--sunk);color:var(--fg);border:1px solid var(--line);
  padding:5px 10px;border-radius:6px;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:560}
.btn.pri:hover:not(:disabled){filter:brightness(1.1)}
.btn.sm{padding:3px 7px;font-size:12px}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* mic đang ghi — đỏ + số giây nhảy, người dùng phải THẤY máy đang nghe */
.btn.rec{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);
  font-weight:600;font-variant-numeric:tabular-nums;animation:recpulse 1.6s ease-in-out infinite}
@keyframes recpulse{50%{filter:brightness(1.12)}}
#pg{display:flex;align-items:center;gap:5px;color:var(--dim);font-family:var(--mono);font-size:12px}
#pgIn{width:44px;text-align:center;background:var(--sunk);color:var(--fg);
  border:1px solid var(--line);border-radius:5px;padding:3px;font-family:var(--mono)}

#main{display:flex;flex:1;min-height:0}
.pv-scroll{flex:1 1 62%;min-width:0;overflow-y:auto;overflow-x:auto;
  background:var(--bg);padding:20px 0 40px;position:relative;scroll-behavior:smooth}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;text-align:center;color:var(--dim);padding:28px}
#empty h2{color:var(--fg);margin:0;font-size:18px;font-weight:620}
#empty p{max-width:420px;font-size:13px;line-height:1.7;margin:0}
.pv-scroll.drag #empty{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-14px}

#pop{position:fixed;z-index:60;display:none;background:var(--panel);
  border:1px solid var(--accent);border-radius:7px;padding:4px;
  box-shadow:0 6px 22px rgba(0,0,0,.28)}
#pop.on{display:flex;gap:4px}

/* ── panel phải ─────────────────────────────────────────────────────── */
#side{flex:0 0 39%;min-width:370px;max-width:580px;border-left:1px solid var(--line);
  background:var(--panel);display:flex;flex-direction:column}
#sideHd{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:9px}
#sideHd .t{font-weight:600;font-size:13px}
#sideHd .s{color:var(--faint);font-size:11px;font-family:var(--mono)}

#log{flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:13px}
.note{background:var(--sunk);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--dim)}
.note b{color:var(--fg)}

.msg{display:flex;flex-direction:column;gap:6px}
.msg.u{align-items:flex-end}
.bub{max-width:96%;padding:8px 11px;border-radius:9px;white-space:pre-wrap;
  word-wrap:break-word;overflow-wrap:anywhere}
.msg.u .bub{background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.msg.a .bub{background:var(--sunk);border:1px solid var(--line);max-width:100%}
.att{font-size:11px;color:var(--faint);font-family:var(--mono);display:flex;
  gap:5px;max-width:96%;align-items:baseline}
.att i{font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}

/* trace — cơ chế phơi ra, không giấu */
.tr{border:1px solid var(--line);border-radius:7px;background:var(--sunk);overflow:hidden}
.tr summary{padding:5px 9px;cursor:pointer;color:var(--dim);font-size:11.5px;
  display:flex;align-items:center;gap:6px;list-style:none;font-family:var(--mono)}
.tr summary::-webkit-details-marker{display:none}
.tr summary::before{content:"▸";transition:transform .15s;display:inline-block}
.tr[open] summary::before{transform:rotate(90deg)}
.tr ol{margin:0;padding:1px 9px 7px 26px;color:var(--dim)}
.tr li{padding:1.5px 0;font-family:var(--mono);font-size:11px}
.tr li b{color:var(--fg);font-weight:600}
.tr .ms{color:var(--faint)}

.bd{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;
  border:1px solid;font-family:var(--mono)}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.badge.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.badge.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.badge.mute{color:var(--dim);border-color:var(--line);background:var(--sunk)}
.badge.cf{color:var(--dim);border-color:var(--line);background:transparent;
  font-variant-numeric:tabular-nums}

.cts{display:flex;gap:5px;flex-wrap:wrap}
.ct{font-size:11px;padding:3px 8px;border-radius:6px;font-family:var(--mono);
  background:var(--accent-soft);border:1px solid transparent;color:var(--accent);
  text-align:left;transition:border-color .12s}
.ct:hover{border-color:var(--accent)}
.ct q{color:var(--faint);font-family:var(--sans);font-style:italic;quotes:'"' '"'}

.acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.acts .sp{flex:1}
.ib{background:transparent;border:1px solid var(--line);color:var(--dim);
  width:26px;height:24px;border-radius:5px;display:grid;place-items:center;transition:.12s}
.ib:hover{background:var(--sunk);color:var(--fg)}
.ib.up{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.ib.dn{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.fus{display:flex;gap:5px;flex-wrap:wrap}
.starter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding:2px 0 4px;font-size:11.5px;color:var(--faint)}
/* Chip HÀNH ĐỘNG khác hẳn chip hỏi tiếp: viền liền + đậm hơn. Bấm vào là
   chạy một việc (gọi nhánh ngoài tài liệu / dựng tin nhắn cho TA), không
   phải gửi thêm một câu hỏi — nên không được trông giống nhau. */
.fu.act{border-style:solid;border-color:var(--warn);color:var(--warn);
  background:var(--warn-soft);font-weight:600}
.fu.act:hover{border-color:var(--warn);color:var(--warn);filter:brightness(.94)}
.fu{font-size:11.5px;padding:3px 9px;border-radius:13px;background:transparent;
  border:1px dashed var(--line);color:var(--dim);transition:.12s}
.fu:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.why{display:flex;gap:5px}
.why input{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:6px;
  padding:4px 8px;color:var(--fg);font-size:12px}
.msg.fold .bub,.msg.fold .cts,.msg.fold .fus,.msg.fold .tr{display:none}

#comp{border-top:1px solid var(--line);padding:9px 11px;display:flex;
  flex-direction:column;gap:7px}
#sel{display:none;font-size:11.5px;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:7px;padding:5px 8px;align-items:center;gap:7px}
#sel.on{display:flex}
#sel .x{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--accent);font-style:italic}
#row{display:flex;gap:7px;align-items:flex-end}
#q{flex:1;resize:none;background:var(--sunk);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;min-height:38px;max-height:130px;font-size:13.5px;line-height:1.5}
#q:focus{outline:none;border-color:var(--accent);background:var(--panel)}
#scen{display:flex;gap:4px;flex-wrap:wrap;font-size:10.5px;align-items:center}
#scen.hide{display:none}
#scen .l{color:var(--faint);font-family:var(--mono)}

/* Chỉ báo chế độ — dùng lại đúng .fu của chip, chỉ thêm trạng thái ĐANG CHỌN.
   Một chế độ ẩn là cái bẫy: người dùng gõ /chat mười phút trước rồi quên, hỏi
   về slide và tưởng hệ thống bịa. Nên nó luôn hiện, không thu gọn. */
#modeBar{display:flex;gap:4px;flex-wrap:wrap;font-size:10.5px;align-items:center;margin-top:6px}
#modeBar .l{color:var(--faint);font-family:var(--mono)}
#modeBar .fu[aria-pressed="true"]{border-style:solid;border-color:var(--accent);
  color:var(--accent);background:var(--accent-soft);font-weight:600}

/* Menu slash — nổi ngay trên ô nhập, không đẩy layout. */
#slash{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;padding:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px}
#slash.hide{display:none}
#slash .it{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;
  cursor:pointer;background:transparent;border:0;color:var(--fg);text-align:left;width:100%}
#slash .it[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
#slash .it code{font-family:var(--mono);font-size:12px;font-weight:600}
#slash .it .d{font-size:11px;color:var(--dim)}
.spin{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:7px;font-size:12.5px;
  z-index:90;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .pv-scroll{scroll-behavior:auto}}
</style>

<div id="app">
  <div id="bar">
    <!-- Nhãn nhân AI do initCore() ghi lại lúc nạp. KHÔNG hardcode: người
         dùng phải biết đang xem AI thật hay văn phong dựng sẵn (HAX G2). -->
    <div class="brand">VLearn Slide Tutor <em id="coreLabel">console · đang dò nhân…</em></div>
    <button class="btn sm" id="open">Mở PDF</button>
    <div id="pg">
      <button class="btn sm" id="prev" disabled>◀</button>
      <input id="pgIn" value="–" disabled><span id="pgTot">/ –</span>
      <button class="btn sm" id="next" disabled>▶</button>
    </div>
    <button class="btn sm" id="zo" disabled>−</button>
    <span id="zl" style="font-family:var(--mono);color:var(--dim);min-width:38px;text-align:center;font-size:12px">—</span>
    <button class="btn sm" id="zi" disabled>+</button>
    <div class="sp"></div>
    <button class="btn sm" id="lect" disabled>▶ Thuyết trình</button>
    <button class="btn sm" id="theme">◐</button>
    <button class="btn sm" id="dl">⬇ Log</button>
  </div>

  <div id="main">
    <div class="pv-scroll" id="scroll">
      <div id="doc"></div>
      <div id="empty">
        <h2>Chưa có tài liệu</h2>
        <p>Kéo-thả PDF vào đây hoặc bấm <b>Mở PDF</b>. Slide không nằm trong repo
           theo quy định bảo mật data — nạp từ máy bạn lúc chạy.</p>
        <button class="btn pri" id="open2">Chọn file PDF</button>
      </div>
    </div>

    <div id="side">
      <div id="sideHd">
        <div style="flex:1">
          <div class="t">Hỏi đáp theo slide</div>
          <div class="s" id="docName">chưa nạp tài liệu</div>
        </div>
      </div>
      <div id="log"></div>
      <div id="comp">
        <div id="sel">
          <span>Trang <b id="selPg">–</b></span>
          <span class="x" id="selTx"></span>
          <button class="btn sm" id="selX">✕</button>
        </div>
        <!-- Menu slash: hiện khi gõ "/" ở ĐẦU ô nhập. Chỉ báo chế độ luôn
             hiển thị ở #modeBar bên dưới — chế độ ẩn là cái bẫy. -->
        <div id="slash" class="hide" role="listbox" aria-label="Chọn chế độ"></div>
        <div id="row">
          <textarea id="q" rows="1" placeholder="Hỏi về nội dung slide… (Enter để gửi)" disabled></textarea>
          <button class="btn" id="mic" disabled>🎙</button>
          <button class="btn" id="convo" disabled>🎧</button>
          <button class="btn pri" id="send" disabled>Gửi</button>
        </div>
        <!-- Chỉ báo chế độ: bấm được để đổi, cho ai không biết lệnh "/". -->
        <div id="modeBar">
          <span class="l">chế độ</span>
          <button class="fu" data-mode="doc">📄 Hỏi theo tài liệu</button>
          <button class="fu" data-mode="chat">💬 Trò chuyện tự do</button>
          <span class="l" id="modeHint">gõ <b>/</b> để đổi nhanh</span>
        </div>
        <div id="scen" class="hide">
          <span class="l">kịch bản</span>
          <button class="fu" data-s="happy">happy</button>
          <button class="fu" data-s="clarify">mơ hồ ②</button>
          <button class="fu" data-s="nog">không căn cứ ①</button>
          <button class="fu" data-s="oos">ngoài phạm vi ③</button>
          <button class="fu" data-s="domain">tiền đề sai ④</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="pop"><button class="btn sm pri" id="ask">💬 Hỏi về đoạn này</button></div>
<input type="file" id="file" accept="application/pdf" hidden>
<div id="toast"></div>

<script type="module">
import { createViewer, injectViewerCSS } from './viewer.mjs';
import { askTutor, setDocIndex, getLog, attachFeedback, AI_CORE, initCore,
         askOutside, buildHandoff, generateLecture } from './core.mjs';
import { $, el, esc, md, decisionBadge, buildRequest, initTheme, downloadLog,
         renderFollowUps, copyText, initMode, parseModeCommand, MODE_COMMANDS } from './ui.mjs';
import { createVoice } from './voice.mjs';

injectViewerCSS();
const theme = initTheme();
const mode  = initMode();
let sel = null, docName = 'chưa nạp';

const toast = (m, ms = 2300) => { const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms); };

/* ── dò nhân AI · nói thật đang chạy cái nào (G2) ───────────────────────
   Có server.mjs + key trong .env  → nhân THẬT (gemma-4).
   Không có                        → nhân mock, và nhãn phải nói rõ là mock,
                                     không được để người xem tưởng là AI thật. */
initCore().then(({ core, model, error }) => {
  $('#coreLabel').textContent = core === 'real'
    ? `console · AI thật (${model})`
    : 'console · nhân mock (không có LLM)';
  $('#coreLabel').title = core === 'real'
    ? `Quyết định trung tâm gọi ${model} qua proxy server.mjs. Trích dẫn được kiểm nguyên văn bằng code.`
    : `Chưa nối được LLM (${error ?? 'không rõ'}). Văn phong câu trả lời là template dựng sẵn — lớp tra cứu và trích dẫn vẫn chạy thật.`;
});

/* ── voice: bấm–nói–bấm + đọc câu trả lời (API PTIT qua proxy) ───────
   Một lần ghi = một request, có đồng hồ đếm giây (bài học §9 — auto-chunk
   3,5s làm hàng đợi phình 9,4× thời gian thực). Mic chỉ sáng khi CẢ PDF đã
   nạp LẪN health probe xanh; probe đỏ thì nút vẫn hiện nhưng disabled kèm
   tooltip nói vì sao — hệ thống đang kém thì phải nói ra (G2), giấu nút đi
   là người dùng tưởng tính năng không tồn tại. */
let voiceOk = false, micState = 'idle', curSpk = null, viaVoice = false;
const voice = createVoice({
  onTimer: s => {
    if (micState !== 'recording') return;
    $('#mic').textContent = `⏹ ${s}s`;
    if (s >= 60){ toast('Đã ghi 60 giây — tự dừng và gửi'); finishRecording(); }
  },
});
function syncMic(){
  const m = $('#mic');
  const dead = !(voiceOk && viewer.total);
  m.disabled = dead || micState === 'processing';
  m.title = voiceOk
    ? 'Hỏi bằng giọng nói — bấm để ghi, bấm lần nữa để gửi'
    : 'Dịch vụ giọng nói (PTIT) không kết nối được — gõ câu hỏi thay nhé';
  $('#convo').disabled = $('#lect').disabled = dead;
  $('#convo').title = voiceOk
    ? 'Hội thoại rảnh tay: nói tự nhiên, ngừng ~1 giây là máy trả lời; nói chen là máy im'
    : 'Dịch vụ giọng nói (PTIT) không kết nối được';
  $('#lect').title = voiceOk
    ? 'AI thuyết trình tài liệu từ trang đang mở — nói chen hoặc bấm lại để dừng và hỏi'
    : 'Dịch vụ giọng nói (PTIT) không kết nối được';
}
voice.probeHealth().then(ok => { voiceOk = ok; syncMic(); });

function resetMic(){
  micState = 'idle';
  $('#mic').textContent = '🎙';
  $('#mic').classList.remove('rec');
  syncMic();
}
async function finishRecording(){
  if (micState !== 'recording') return;
  micState = 'processing';
  const m = $('#mic');
  m.classList.remove('rec'); m.textContent = '…'; m.disabled = true;
  try{
    const wav = await voice.stopRecording();
    if (!wav){ toast('Không nghe rõ — thử nói gần micro hơn'); return resetMic(); }
    const text = (await voice.transcribe(wav)).trim();
    if (!text){ toast('Không nghe rõ — thử nói gần micro hơn'); return resetMic(); }
    /* Điền vào ô rồi gửi luôn — một cử chỉ. Câu nhận diện vẫn hiện thành
       bubble của người dùng nên nhận sai là thấy ngay và hỏi lại được. */
    $('#q').value = text;
    resetMic();
    viaVoice = true;         // câu hỏi bằng giọng → answer về là sưởi TTS sẵn
    send();
  }catch(err){
    console.error('[voice]', err);
    toast('Nhận diện giọng nói lỗi — thử lại hoặc gõ câu hỏi');
    resetMic();
  }
}
$('#mic').onclick = async () => {
  if (micState === 'recording') return finishRecording();
  if (micState !== 'idle') return;
  try{
    await voice.startRecording();
    micState = 'recording';
    $('#mic').classList.add('rec');
    $('#mic').textContent = '⏹ 0s';
  }catch(err){
    console.error('[voice]', err);
    toast('Không có quyền micro — cấp quyền trong trình duyệt rồi thử lại');
  }
};
/* Đọc to một câu trả lời; bấm lại là dừng; bấm 🔊 ở bubble khác thì cắt
   cái đang phát (speak() tự stopSpeaking trước). */
async function speakAnswer(btn, text){
  if (curSpk === btn){ voice.stopSpeaking(); return; }   // đang phát chính nó → dừng
  if (curSpk){ curSpk.textContent = '🔊 Đọc'; }          // cắt bubble khác
  curSpk = btn; btn.textContent = '⏹ Dừng';
  try{ await voice.speak(text); }
  catch(err){ console.error('[voice]', err); toast('Không đọc được — dịch vụ TTS lỗi'); }
  finally{
    if (curSpk === btn) curSpk = null;
    btn.textContent = '🔊 Đọc';
  }
}

/* ══════════════════════════════════════════════════════════════════════
   🎧 HỘI THOẠI + ▶ THUYẾT TRÌNH
   ══════════════════════════════════════════════════════════════════════
   Hội thoại: mic mở liên tục, VAD tự cắt câu (voice.mjs), trả lời tự đọc.
   Thuyết trình: LLM soạn lời giảng từng trang từ chính text trang đó
   (generateLecture — luật "chỉ dùng chữ trên trang"), TTS đọc, slide cuộn
   theo, highlight câu nguyên văn. Nói chen hoặc bấm là DỪNG để hỏi — câu
   hỏi đi qua send() bình thường nên hưởng trọn grounding + trích dẫn +
   eval; mạch giảng được tiêm vào history (lectureCtx). Trả lời xong có
   chip giảng tiếp đúng trang đang dở. */
let convoOn = false, qaBusy = false, qaPending = null, lectureCtx = '';
const lect = { on:false, page:1, resumeAt:0, prevSummary:'', nextGen:null };

const lectLabel = t => { $('#lect').textContent = t; };
const convoLabel = () => { $('#convo').textContent = convoOn ? '🎧 nghe' : '🎧'; };

function pauseLecture(){
  if (!lect.on) return;
  lect.on = false;
  lect.resumeAt = lect.page;
  voice.stopSpeaking();
  $('#lect').classList.remove('on');
  lectLabel(`▶ Giảng tiếp Tr.${lect.resumeAt}`);
}
function stopLecture(){
  lect.on = false; lect.resumeAt = 0; lect.prevSummary = ''; lect.nextGen = null;
  lectureCtx = '';
  $('#lect').classList.remove('on');
  lectLabel('▶ Thuyết trình');
}

/* Lời giảng hiện thành bubble trong log — người nghe đối chiếu được bằng
   mắt, và nhãn mock/mock-fallback nói thật khi đang đọc nguyên văn (G2). */
function addLectureNote(p, gen){
  const m = el('div','msg a'), b = el('div','bub');
  const tag = gen.core_used === 'real' ? '' : ` · ${gen.core_used}`;
  b.innerHTML = `<span style="color:var(--faint);font-family:var(--mono);font-size:11px">🎓 Đang giảng Tr.${p}${tag}</span><br>${md(gen.script)}`;
  m.append(b); $('#log').append(m); scroll();
}

async function runLecture(){
  while (lect.on && lect.page <= viewer.total){
    const p = lect.page;
    lectLabel(`⏸ Đang giảng Tr.${p}`);
    viewer.goTo(p);
    await viewer.settled();
    if (!lect.on) return;

    /* script: dùng bản đã soạn trước trong lúc đọc trang trước, nếu đúng trang */
    let gen;
    try{
      gen = (lect.nextGen?.page === p)
        ? await lect.nextGen.promise
        : await generateLecture({ pageNum:p, pageText: viewer.pageText(p), docTitle: docName, prevSummary: lect.prevSummary });
    }catch(err){ console.error('[lecture]', err); toast('Không soạn được lời giảng — dừng'); return pauseLecture(); }
    lect.nextGen = null;
    if (!lect.on) return;

    if (!gen.script){                       // trang scan/trống — skip có nhãn, không giảng mò
      toast(`Trang ${p} không có chữ đọc được — bỏ qua`);
      lect.page = p + 1;
      continue;
    }

    lect.prevSummary = gen.summary;
    lectureCtx = `(đang thuyết trình ${docName}; vừa giảng Trang ${p}: ${gen.summary})`;
    addLectureNote(p, gen);

    /* highlight CHỈ quote nguyên văn thật — chống bịa cho cả phần nhìn */
    const pt = viewer.pageText(p).replace(/\s+/g, ' ');
    const q0 = (gen.key_quotes ?? []).map(q => q.replace(/\s+/g, ' ').trim()).find(q => q && pt.includes(q));
    if (q0) viewer.highlight(p, q0);

    /* soạn + sưởi TTS trang KẾ trong lúc đang đọc trang này — không có
       khoảng lặng giữa hai trang */
    const np = p + 1;
    if (np <= viewer.total){
      const promise = generateLecture({ pageNum:np, pageText: viewer.pageText(np), docTitle: docName, prevSummary: gen.summary })
        .then(g => { if (g.script && voiceOk) voice.prefetch(g.script); return g; })
        .catch(() => null);
      lect.nextGen = { page: np, promise };
    }

    try{ await voice.speak(gen.script); }
    catch(err){ console.error('[lecture tts]', err); toast('Giọng nói lỗi — tạm dừng thuyết trình'); return pauseLecture(); }
    if (!lect.on) return;                   // bị chen ngang trong lúc đọc → đã pause
    lect.page = p + 1;
  }
  if (lect.on){ stopLecture(); toast('🎓 Đã giảng hết tài liệu'); }
}

async function startLecture(){
  if (lect.on || !viewer.total || !voiceOk) return;
  lect.on = true;
  lect.page = lect.resumeAt || viewer.page || 1;
  lect.resumeAt = 0;
  $('#lect').classList.add('on');
  /* Mở tai nghe hội thoại để NGẮT BẰNG LỜI; không có quyền mic thì vẫn
     giảng được, ngắt bằng nút */
  if (!convoOn){ try{ await startConvoSession(); }catch{ toast('Không có mic — ngắt thuyết trình bằng nút ▶'); } }
  runLecture();
}

$('#lect').onclick = () => { lect.on ? pauseLecture() : startLecture(); };

/* ── phiên hội thoại: utterance → hỏi → tự đọc trả lời ─────────────── */
async function handleUtter(text){
  if (qaBusy){ qaPending = text; return; }  // giữ câu MỚI NHẤT, không xếp hàng dài
  qaBusy = true;
  convoLabel();
  try{
    $('#q').value = text;
    const res = await send();
    if (res?.answer && (convoOn || lect.resumeAt)){
      try{ await voice.speak(res.answer); }
      catch(err){ console.error('[voice]', err); toast('Không đọc được — dịch vụ TTS lỗi'); }
    }
  }finally{ qaBusy = false; }
  if (qaPending){ const t = qaPending; qaPending = null; return handleUtter(t); }
  /* Đang dở bài giảng → mời giảng tiếp bằng chip (người quyết, máy không tự) */
  if (lect.resumeAt && !$('#log').querySelector('.resume-lect')){
    const s = el('div','starter resume-lect');
    const b = el('button','fu act', `▶ Giảng tiếp từ Trang ${lect.resumeAt}`);
    b.onclick = () => { s.remove(); startLecture(); };
    const x = el('button','fu', 'Thôi, dừng thuyết trình');
    x.onclick = () => { s.remove(); stopLecture(); };
    s.append(b, x); $('#log').append(s); scroll();
  }
}

async function startConvoSession(){
  await voice.startConversation({
    onUtterance: handleUtter,
    onHearing: h => {
      /* Người mở miệng khi đang giảng → dừng NGAY từ lúc phát hiện giọng,
         không đợi STT xong — cảm giác "nó nghe mình thật" nằm ở đây */
      if (h && lect.on) pauseLecture();
      $('#convo').textContent = h ? '🎙 …' : (convoOn ? '🎧 nghe' : '🎧');
    },
  });
  convoOn = true;
  $('#convo').classList.add('on');
  convoLabel();
}

$('#convo').onclick = async () => {
  if (!convoOn){
    try{
      await startConvoSession();
      toast('Hội thoại rảnh tay: nói tự nhiên, ngừng ~1 giây là mình trả lời. Nói chen khi mình đang đọc là mình im ngay. Bấm 🎧 để tắt.', 4200);
    }catch(err){
      console.error('[convo]', err);
      toast('Không có quyền micro — cấp quyền trong trình duyệt rồi thử lại');
    }
  } else {
    voice.stopConversation();
    voice.stopSpeaking();
    convoOn = false; qaPending = null;
    $('#convo').classList.remove('on');
    convoLabel();
    if (lect.on) pauseLecture();
  }
};

/* ── viewer ────────────────────────────────────────────────────────── */
const viewer = createViewer({
  container: $('#doc'),
  onPage: p => { $('#pgIn').value = p; },
  onReady: ({ total, pages, name }) => {
    setDocIndex(pages);
    docName = `${name} · ${total} trang`;
    $('#docName').textContent = docName;
    $('#empty').style.display = 'none';
    $('#pgTot').textContent = '/ ' + total;
    $('#zl').textContent = '100%';
    ['prev','next','zi','zo','pgIn','q','send'].forEach(i => $('#'+i).disabled = false);
    syncMic();          // mic sáng riêng: cần CẢ PDF lẫn health probe voice xanh
    $('#scen').classList.remove('hide');
    greet(total);
    const ok = pages.filter(p => p.text.length > 20).length;
    toast(`${total} trang · trích được text ${ok}/${total}`);
  },
  onSelection: s => {
    sel = s;
    const pop = $('#pop');
    if (!s || !s.rect){ pop.classList.remove('on'); return; }
    pop.style.left = Math.max(6, s.rect.left + s.rect.width / 2 - 80) + 'px';
    pop.style.top  = Math.max(6, s.rect.top - 40) + 'px';
    pop.classList.add('on');
  },
});

/* ── hội thoại ─────────────────────────────────────────────────────── */
function greet(total){
  $('#log').replaceChildren();
  const n = el('div','note');
  n.innerHTML = `<b>Mình trả lời dựa trên tài liệu đang mở</b> (${total} trang), luôn kèm số trang để bạn tự kiểm.
    Ngoài tài liệu mình nói rõ là ngoài, không trộn vào.<br>
    <span style="color:var(--faint)">Bôi đen một đoạn rồi bấm “Hỏi về đoạn này”, hoặc gõ câu hỏi bên dưới.</span>`;
  $('#log').append(n);

  /* Ba câu mở màn bấm được. Vòng validation là 10 phút/người và mình phải
     IM LẶNG quan sát — người thử ngồi trước ô nhập trống mà không biết gõ gì
     là mất luôn mấy phút đầu. Ba câu này cũng là ba dạng khác nhau: cấu trúc
     tài liệu · trang đang xem · một câu KHÔNG có trong tài liệu (để họ thấy
     nó từ chối thế nào — thứ đáng xem nhất). */
  const s = el('div','starter');
  s.innerHTML = '<span>Thử ngay:</span>';
  for (const q of ['Tài liệu này gồm những phần nào?',
                   'Tóm tắt trang mình đang xem',
                   'LangGraph có hỗ trợ streaming không?']){
    const b = el('button','fu', q);
    b.onclick = () => { $('#q').value = q; send(); };
    s.append(b);
  }
  $('#log').append(s);
}

function addUser(q, s){
  const m = el('div','msg u');
  if (s){
    const a = el('div','att');
    a.innerHTML = `Trang ${s.page} · <i>“${esc(s.text.slice(0,64))}${s.text.length>64?'…':''}”</i>`;
    m.append(a);
  }
  m.append(el('div','bub', q));
  $('#log').append(m); scroll();
}

function addWait(){
  const m = el('div','msg a'), b = el('div','bub');
  b.innerHTML = `<span class="spin"></span> <span style="color:var(--dim)">đang tìm căn cứ trong ${viewer.total} trang…</span>`;
  m.append(b); $('#log').append(m); scroll();
  return m;
}

/* `req` là AskRequest đã sinh ra res — cần giữ lại để chip hành động dựng
   được tin nhắn chuyển TA và gọi lại nhánh ngoài tài liệu đúng ngữ cảnh. */
function addAI(res, node, req){
  node.replaceChildren();
  const d = el('details','tr'); d.open = true;
  d.append(el('summary', null, `workflow · ${res.trace.length} bước · ${res.latency_ms}ms`));
  const ol = el('ol');
  res.trace.forEach(t => {
    const li = el('li');
    li.innerHTML = `<b>${esc(t.step)}</b> — ${esc(t.detail)} <span class="ms">${t.ms}ms</span>`;
    ol.append(li);
  });
  d.append(ol); node.append(d);

  const info = decisionBadge(res.decision);
  const bd = el('div','bd');
  bd.append(el('span', 'badge ' + info.tone, `${info.icon} ${info.label}`));
  bd.append(el('span','badge cf', 'tin cậy ' + Math.round(res.confidence * 100) + '%'));
  node.append(bd);

  const b = el('div','bub');
  b.innerHTML = md(res.answer);
  if (res.clarifying_question){
    const c = el('div');
    c.style.cssText = 'margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-weight:560';
    c.innerHTML = md(res.clarifying_question);
    b.append(c);
  }
  /* Phần NGOÀI TÀI LIỆU — phải nhìn là biết ngay nó khác loại với phần trên.
     `outside_note` đã nằm trong hợp đồng từ v1.1 nhưng chưa bao giờ được vẽ ra;
     giờ nhánh ① đính câu trả lời kiến thức chung vào đây để người hỏi không bị
     bỏ rơi. Viền vàng + nhãn là thứ giữ cho hai phần không lẫn vào nhau. */
  if (res.outside_note){
    const o = el('div');
    o.style.cssText = 'margin-top:10px;padding:9px 11px;border-left:3px solid var(--warn);' +
                      'background:color-mix(in srgb, var(--warn) 8%, transparent);border-radius:0 6px 6px 0';
    const tag = el('div');
    tag.style.cssText = 'font-size:11px;font-weight:700;color:var(--warn);margin-bottom:5px;letter-spacing:.02em';
    tag.textContent = '⚠ NGOÀI TÀI LIỆU — không đối chiếu được bằng slide đang mở';
    o.append(tag);
    const body = el('div');
    body.innerHTML = md(res.outside_note);
    o.append(body);
    b.append(o);
  }
  node.append(b);

  if (res.citations?.length){
    const c = el('div','cts');
    res.citations.forEach(ct => {
      const chip = el('button','ct');
      chip.innerHTML = `Trang ${ct.ref} <q>${esc(ct.quote.slice(0,38))}…</q>`;
      chip.title = ct.quote;
      chip.onclick = () => viewer.highlight(ct.page, ct.quote);
      c.append(chip);
    });
    node.append(c);
  }

  const acts = el('div','acts');
  const up = el('button','ib','👍'), dn = el('button','ib','👎');
  up.title = 'Hữu ích'; dn.title = 'Chưa đúng';
  const why = el('div','why'); why.style.display = 'none';
  const inp = el('input'); inp.placeholder = 'Sai chỗ nào?';
  const ok = el('button','btn sm','Gửi');
  why.append(inp, ok);
  up.onclick = () => { up.classList.toggle('up'); dn.classList.remove('dn'); why.style.display='none'; attachFeedback('up',''); };
  dn.onclick = () => {
    dn.classList.add('dn'); up.classList.remove('up');
    why.style.display = 'flex'; inp.focus();
    /* Bấm 👎 xong thì đưa luôn đường sửa, đừng bắt người ta tự nghĩ ra cách
       nói lại (G9 — sửa dễ). Trang vừa trích là phạm vi hẹp hợp lý nhất. */
    const pg = res.citations?.[0]?.page;
    if (pg && !why.querySelector('.retry')){
      const rb = el('button','btn sm retry', `Hỏi lại, chỉ trong Trang ${pg}`);
      rb.onclick = () => { $('#q').value = `Chỉ trả lời trong phạm vi Trang ${pg}: `; $('#q').focus(); };
      why.append(rb);
    }
  };
  ok.onclick = () => { attachFeedback('down', inp.value); why.style.display='none'; toast('Đã ghi vào log phiên'); };

  /* Copy KEM SO TRANG — dán vào ghi chú mà mất nguồn thì câu trả lời thành
     tin đồn. Đây là chỗ rẻ nhất để giữ được tính kiểm chứng ra ngoài app. */
  const cp = el('button','btn sm','Chép');
  cp.title = 'Chép câu trả lời kèm số trang trích dẫn';
  cp.onclick = async () => {
    const src = (res.citations ?? [])
      .map(c => `Trang ${c.ref}: "${c.quote}"`).join('\n');
    const txt = `${res.answer}\n\n— Nguồn (${docName}):\n${src || '(không có trích dẫn)'}`;
    toast(await copyText(txt) ? '📋 Đã chép câu trả lời kèm nguồn' : 'Không chép được');
  };

  const nar = el('button','btn sm','Thu hẹp phạm vi');
  nar.onclick = () => { $('#q').value = `Chỉ trả lời trong phạm vi Trang ${res.citations[0]?.page ?? viewer.page}: `; $('#q').focus(); };

  /* Đọc to bằng giọng PTIT — cùng nguồn với STT, không dùng giọng trình
     duyệt (đã dính vụ giọng Anh đọc tiếng Việt im lặng, §9/G2). Voice chết
     thì nút disabled kèm lý do, không giấu. */
  const spk = el('button','btn sm','🔊 Đọc');
  if (voiceOk){
    spk.title = 'Đọc câu trả lời (giọng PTIT)';
    spk.onclick = () => speakAnswer(spk, res.answer);
  } else {
    spk.disabled = true;
    spk.title = 'Dịch vụ giọng nói (PTIT) không kết nối được';
  }

  const fold = el('button','btn sm','✕ Ẩn');
  fold.onclick = () => node.classList.toggle('fold');
  acts.append(up, dn, nar, cp, spk, el('span','sp'), fold);
  node.append(acts, why);

  /* ── follow-up: chip HỎI TIẾP và chip HÀNH ĐỘNG ─────────────────────
     Trước bản này mọi chip đều bị nhồi vào ô nhập rồi gửi đi, nên bấm
     "Chuyển câu này cho TA" là gửi đúng chuỗi đó làm câu hỏi mới → ra kết
     quả vô nghĩa. Giờ chip hành động gọi handler thật; chip nào không có
     handler thì renderFollowUps() không vẽ (xem ui.mjs). */
  const f = el('div','fus');
  renderFollowUps(res, f, {
    question: label => { $('#q').value = label; send(); },

    /* Đường lui ③: đang ở chế độ trò chuyện mà câu hỏi tra được trong tài
       liệu. KHÔNG tự đổi chế độ — chỉ mời. Cùng nguyên tắc với đường lui ①:
       bước sang chỗ có trích dẫn là quyết định của người dùng, không phải
       của AI. Khác là họ không phải tự mò ra công tắc. */
    ask_in_doc_mode: async () => {
      setMode('doc', { toast: false });
      $('#q').value = req.question;
      toast('📄 Đã chuyển sang Hỏi theo tài liệu — hỏi lại câu này kèm trích dẫn');
      await send();
    },

    /* Đường lui ①: chỉ mở khi NGƯỜI DÙNG bấm — AI không tự bước ra ngoài
       tài liệu. Đây là mức automation Conditional ở dạng code. */
    answer_outside: async () => {
      const n2 = addWait();
      try{
        const out = await askOutside(req);
        addAI(out, n2, req);
      }catch(err){
        n2.replaceChildren(el('div','bub','Không gọi được mô hình: ' + err.message));
      }
    },

    /* Đường lui ②: dựng đủ ngữ cảnh để TA không phải hỏi lại học viên
       "bạn đang ở trang nào". MOCK có nhãn — không có tích hợp Discord thật. */
    handoff_ta: async () => {
      const msg = buildHandoff(req, res);
      const ok = await copyText(msg);
      toast(ok
        ? '📋 Đã copy tin nhắn cho TA — kèm số trang, đoạn bôi đen và lý do tutor không trả lời được. Dán vào Discord khoá (bản demo chưa nối Discord thật).'
        : 'Không copy được — tin nhắn đã in ra Console (F12).', 4200);
      if (!ok) console.log(msg);
    },
  }, { q:'fu', a:'fu act' });
  if (f.childElementCount) node.append(f);
  scroll();
}

const scroll = () => { const l = $('#log'); l.scrollTop = l.scrollHeight; };

/* ══════════════════════════════════════════════════════════════════════
   CHẾ ĐỘ HỎI — công tắc do người dùng chọn (CONTRACT v1.3)
   ══════════════════════════════════════════════════════════════════════
   Thay cho hơn 20 cổng regex vốn phải ĐOÁN xem người dùng hỏi tài liệu hay
   tán gẫu. Ý định là thứ duy nhất người dùng biết chắc còn máy phải suy
   luận — nên hỏi thẳng rẻ hơn đoán.

   Gọi bằng "/" trong ô nhập (nhanh, không rời bàn phím) HOẶC bấm chỉ báo
   bên dưới (cho ai không biết có lệnh). Chỉ báo luôn hiện, không thu gọn. */
const PLACEHOLDER = {
  doc:  'Hỏi về nội dung slide… (Enter để gửi · / để đổi chế độ)',
  chat: 'Trò chuyện tự do — không tra tài liệu… (/ để đổi chế độ)',
};
function syncMode(){
  const m = mode.get();
  for (const b of document.querySelectorAll('#modeBar .fu'))
    b.setAttribute('aria-pressed', String(b.dataset.mode === m));
  $('#q').placeholder = PLACEHOLDER[m];
}
function setMode(m, { toast: say = true } = {}){
  if (mode.get() === m){ syncMode(); return; }
  mode.set(m);
  syncMode();
  if (say) toast(m === 'chat'
    ? '💬 Trò chuyện tự do — mình sẽ KHÔNG tra tài liệu và không trích dẫn'
    : '📄 Hỏi theo tài liệu — mọi câu trả lời sẽ kèm trích dẫn số trang');
}
for (const b of document.querySelectorAll('#modeBar .fu'))
  b.onclick = () => { setMode(b.dataset.mode); $('#q').focus(); };

/* ── menu "/" ──────────────────────────────────────────────────────────
   Chỉ mở khi "/" đứng ở ĐẦU ô nhập. Câu hỏi có "/" ở giữa ("A/B testing")
   không bị đụng. Và đây là phân tích trên đúng thứ NGƯỜI DÙNG TỰ GÕ, không
   phải trên page_text — PDF chứa dòng "/chat" không kích hoạt được gì. */
let slashIx = 0;
const slashOpen = () => !$('#slash').classList.contains('hide');
function closeSlash(){ $('#slash').classList.add('hide'); }
function renderSlash(){
  const raw = $('#q').value;
  const m = /^\s*\/([a-z]*)$/i.exec(raw);
  if (!m){ closeSlash(); return; }
  const typed = m[1].toLowerCase();
  const list = MODE_COMMANDS.filter(c => c.cmd.slice(1).startsWith(typed));
  if (!list.length){ closeSlash(); return; }
  slashIx = Math.min(slashIx, list.length - 1);
  const box = $('#slash');
  box.replaceChildren(...list.map((c, i) => {
    const b = el('button', 'it');
    b.type = 'button';
    b.setAttribute('aria-selected', String(i === slashIx));
    b.append(el('code', '', c.cmd), el('span', 'd', c.desc));
    b.onclick = () => pickSlash(c);
    return b;
  }));
  box._list = list;
  box.classList.remove('hide');
}
function pickSlash(c){
  setMode(c.mode);
  $('#q').value = '';
  closeSlash();
  $('#q').focus();
}

async function send(){
  const raw = $('#q').value;
  /* Cắt tiền tố lệnh TRƯỚC khi dựng request: "/chat xin chào" đổi chế độ rồi
     gửi "xin chào" — nhân nhận câu sạch, không bao giờ thấy dấu "/". */
  const cmd = parseModeCommand(raw);
  if (cmd.mode){
    setMode(cmd.mode);
    closeSlash();
    if (!cmd.text.trim()){          // "/chat" đứng một mình → chỉ đổi chế độ
      $('#q').value = ''; $('#q').style.height = 'auto';
      return null;
    }
    $('#q').value = cmd.text;
  }
  const q = $('#q').value.trim();
  if (!q || !viewer.total) return;
  const s = sel;
  addUser(q, s);
  $('#q').value = ''; $('#q').style.height = 'auto';
  sel = null; $('#sel').classList.remove('on'); $('#pop').classList.remove('on');

  const node = addWait();
  const fromVoice = viaVoice; viaVoice = false;
  try{
    const request = buildRequest({
      question: q, selection: s, viewer, docName, mode: mode.get(),
      /* Đang/vừa thuyết trình thì tiêm mạch giảng vào history — "cái này/
         phần này" trong câu hỏi chen ngang tự neo đúng chỗ đang giảng. */
      history: [
        ...getLog().slice(-4).map(l => ({ role:'user', content:l.request.question })),
        ...(lectureCtx ? [{ role:'assistant', content: lectureCtx }] : []),
      ],
    });
    const res = await askTutor(request);
    addAI(res, node, request);
    /* Hỏi bằng giọng thì khả năng cao sẽ muốn NGHE đáp — tổng hợp sẵn câu
       đầu ngay lúc này, bấm 🔊 là ra tiếng liền. Chỉ khi hỏi bằng giọng,
       để không tốn request TTS cho người chỉ gõ phím. */
    if (fromVoice && voiceOk) voice.prefetch(res.answer);
    return res;
  }catch(err){
    node.replaceChildren(el('div','bub','Lỗi core: ' + err.message));
    return null;
  }
}

/* ── kịch bản demo ─────────────────────────────────────────────────── */
const SCEN = {
  happy:{p:22,q:'Giải thích đoạn bôi đen ở Trang 22.',s:true},
  clarify:{p:37,q:'cái này khác cái kia chỗ nào?'},
  nog:{p:30,q:'LangGraph có hỗ trợ streaming không?'},
  oos:{p:40,q:'Làm hộ mình Lab 3 với, cho mình đáp án luôn.'},
  domain:{p:20,q:'ReAct là một kiểu fine-tuning đúng không?'},
};
document.querySelectorAll('#scen .fu').forEach(b => b.onclick = async () => {
  const s = SCEN[b.dataset.s];
  if (!s || !viewer.total) return;
  const p = Math.min(s.p, viewer.total);
  viewer.goTo(p);
  if (s.s){
    sel = { text: viewer.pageText(p).slice(0,220), page: p };
    $('#sel').classList.add('on');
    $('#selPg').textContent = sel.page;
    $('#selTx').textContent = '“' + sel.text.slice(0,70) + '…”';
  }
  $('#q').value = s.q;
  /* PHẢI chờ cuộn tới đúng trang trước khi gửi. Cuộn mượt qua mấy chục trang
     mất hơn 260ms, mà giờ page_text của trang hiện tại là nguồn sự thật —
     gửi sớm là tutor tóm tắt sai trang. */
  await viewer.settled();
  send();
});

/* ── wiring ────────────────────────────────────────────────────────── */
const openFile = () => $('#file').click();
$('#open').onclick = openFile; $('#open2').onclick = openFile;
$('#file').onchange = async e => {
  const f = e.target.files[0];
  if (f) viewer.load(new Uint8Array(await f.arrayBuffer()), f.name);
};
const sc = $('#scroll');
sc.addEventListener('dragover', e => { e.preventDefault(); sc.classList.add('drag'); });
sc.addEventListener('dragleave', () => sc.classList.remove('drag'));
sc.addEventListener('drop', async e => {
  e.preventDefault(); sc.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f?.type === 'application/pdf') viewer.load(new Uint8Array(await f.arrayBuffer()), f.name);
  else toast('Cần một file PDF');
});
$('#ask').onclick = () => {
  $('#pop').classList.remove('on');
  if (!sel) return;
  $('#sel').classList.add('on');
  $('#selPg').textContent = sel.page;
  $('#selTx').textContent = '“' + sel.text.slice(0,80) + (sel.text.length>80?'…':'') + '”';
  $('#q').value = `Giải thích đoạn bôi đen ở Trang ${sel.page}.`;
  $('#q').focus();
};
$('#selX').onclick = () => { sel = null; $('#sel').classList.remove('on'); };
$('#prev').onclick = () => viewer.goTo(viewer.page - 1);
$('#next').onclick = () => viewer.goTo(viewer.page + 1);
$('#pgIn').onchange = e => viewer.goTo(parseInt(e.target.value) || 1);
$('#zi').onclick = () => { viewer.setZoom(viewer.scale + .2); $('#zl').textContent = Math.round((viewer.scale+.2)/viewer.fit*100)+'%'; };
$('#zo').onclick = () => { viewer.setZoom(viewer.scale - .2); $('#zl').textContent = Math.round((viewer.scale-.2)/viewer.fit*100)+'%'; };
$('#send').onclick = send;
$('#q').addEventListener('keydown', e => {
  /* Menu "/" đang mở thì phím mũi tên/Enter thuộc về MENU, không phải ô nhập —
     nếu không thì Enter vừa chọn lệnh vừa gửi câu hỏi rỗng. */
  if (slashOpen()){
    const list = $('#slash')._list ?? [];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      slashIx = (slashIx + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length;
      renderSlash();
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); pickSlash(list[slashIx]); return; }
    if (e.key === 'Escape'){ e.preventDefault(); closeSlash(); return; }
    if (e.key === 'Tab'){ e.preventDefault(); pickSlash(list[slashIx]); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('#q').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(130, e.target.scrollHeight) + 'px';
  slashIx = 0;
  renderSlash();
});
$('#q').addEventListener('blur', () => setTimeout(closeSlash, 120));
syncMode();
$('#theme').onclick = () => theme.toggle();
$('#dl').onclick = () => {
  const t = getLog();
  if (!t.length) return toast('Chưa có lượt hỏi nào');
  downloadLog(t, { core: AI_CORE, variant:'console', document: docName });
  toast(`Đã xuất ${t.length} lượt`);
};
document.addEventListener('mousedown', e => {
  if (!$('#pop').contains(e.target)) $('#pop').classList.remove('on');
});
addEventListener('resize', () => { if (viewer.total) viewer.fitWidth().then(() => viewer.setZoom(viewer.fit)); });

const qs = new URLSearchParams(location.search).get('file');
if (qs) fetch(qs).then(r => r.arrayBuffer())
  .then(b => viewer.load(new Uint8Array(b), qs.split('/').pop()))
  .catch(e => toast('Không nạp được ?file= — ' + e.message));
</script>
